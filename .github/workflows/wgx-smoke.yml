---
name: wgx-smoke

"on":
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - ".wgx/**"
      - "docs/wgx-konzept.md"
      - ".github/workflows/wgx-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    # Compatibility filename only: verification policy is owned by Metarepo.
    uses: heimgewebe/metarepo/.github/workflows/reusable-repo-verify.yml@5afd566efb27fb6594ff32daa4d3b86c5184ba30
    with:
      mode: smoke
    permissions:
      contents: read
